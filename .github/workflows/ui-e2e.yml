name: Emoteca visual UI checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  chromium-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright for browser tests
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Build production Docker container (Nginx + catalog API)
        run: docker build -t emoteca-catalog-test .
      - name: Serve production image without TMDB credentials
        run: |
          docker run --name emoteca-catalog-test -d -p 127.0.0.1:8000:80 emoteca-catalog-test
          for i in $(seq 1 45); do
            curl -fsS http://127.0.0.1:8000/index.html >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/catalog/status
      - name: Run browser flows and capture screenshots
        run: node tests/ui-e2e.mjs
      - name: Show Docker logs on failure
        if: failure()
        run: docker logs emoteca-catalog-test || true
      - name: Upload design review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emoteca-ui-desktop-mobile
          path: ui-screenshots/
          if-no-files-found: ignore
