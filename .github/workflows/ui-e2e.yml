name: Emoteca visual UI checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  chromium-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright for browser tests
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Serve static Emoteca app
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/emoteca-server.log 2>&1 &
          echo $! > /tmp/emoteca-server.pid
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/index.html >/dev/null && break
            sleep 1
          done
      - name: Run browser flows and capture screenshots
        run: node tests/ui-e2e.mjs
      - name: Upload design review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emoteca-ui-desktop-mobile
          path: ui-screenshots/
          if-no-files-found: ignore
