name: Emoteca smoke tests

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

jobs:
  browser-code-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run dependency-free smoke tests
        run: node --test tests/*.test.mjs
